<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2350">
<title>히라가나 기말 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column on 원고지(genkō) grid paper; kana sit in squares, teacher's 朱 red marks flag what will be tested. Bottom tab bar for thumbs. */
:root{
  --paper:#F3F5F9;
  --sheet:#FFFFFF;
  --ink:#1A2350;
  --ink-2:#5B6488;
  --grid:#D6DCEA;
  --grid-soft:#E7EBF3;
  --shu:#C8382A;
  --shu-soft:#FBE9E6;
  --ai:#2B46B8;
  --ai-soft:#E6EBFB;
  --good:#23795A;
  --good-soft:#E2F3EA;
  --bad:#C8382A;
  --bad-soft:#FBE9E6;
  --shadow:0 1px 2px rgba(26,35,80,.06),0 4px 14px rgba(26,35,80,.06);
  --f-jp:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1328;--sheet:#171C38;--ink:#E7EAF6;--ink-2:#9AA3C6;--grid:#2C3458;--grid-soft:#222944;
    --shu:#FF7562;--shu-soft:#3A1F2A;--ai:#8EA2FF;--ai-soft:#232B55;--good:#5CCB9C;--good-soft:#173A31;--bad:#FF7562;--bad-soft:#3A1F2A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1328;--sheet:#171C38;--ink:#E7EAF6;--ink-2:#9AA3C6;--grid:#2C3458;--grid-soft:#222944;
  --shu:#FF7562;--shu-soft:#3A1F2A;--ai:#8EA2FF;--ai-soft:#232B55;--good:#5CCB9C;--good-soft:#173A31;--bad:#FF7562;--bad-soft:#3A1F2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid-soft) 1px,transparent 1px),linear-gradient(90deg,var(--grid-soft) 1px,transparent 1px);
  background-size:28px 28px;
}
.jp{font-family:var(--f-jp);font-weight:600;letter-spacing:.02em}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.45rem}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.tiny{font-size:.75rem;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.top .brand{display:flex;flex-direction:column}
.top .brand .jp{font-size:.9rem;color:var(--shu)}
.theme-btn{border:1px solid var(--grid);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.8rem;white-space:nowrap;flex:none}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--grid);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;width:100%}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 2px 9px;text-decoration:none;color:var(--ink-2);font-size:.74rem;font-weight:500}
nav.tabs a .k{font-family:var(--f-jp);font-size:1.25rem;line-height:1.2;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--shu)}
nav.tabs a[aria-current="page"] .k{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
/* buttons */
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.shu{background:var(--shu);border-color:var(--shu);color:var(--sheet)}
.btn.ghost{border-color:var(--grid);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--grid);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.8}
[hidden]{display:none!important}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero .stamp{width:78px;height:78px;border:3px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;text-align:center;
  font-weight:700;line-height:1.1;transform:rotate(-8deg);font-size:.8rem}
.hero .stamp b{font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--grid-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.starts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.start{text-align:left;border:1.5px solid var(--grid);background:var(--sheet);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.start b{font-size:1rem}
.start .jp{font-size:1.6rem;color:var(--shu);line-height:1}
.start.main{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.start.main .muted{color:inherit;opacity:.75}
.start.main .jp{color:var(--sheet)}
.decks{display:grid;gap:8px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:10px;align-items:center;border:1px solid var(--grid);background:var(--sheet);border-radius:8px;padding:10px 12px;text-align:left}
.deck .nm{font-weight:600;min-width:0}
.deck .num{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-2);text-align:right}
.trap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding-block:8px;border-top:1px dashed var(--grid)}
.trap:first-child{border-top:0}
.trap .n{font-weight:700;color:var(--shu);font-variant-numeric:tabular-nums}
/* notes */
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.secnav .chip{white-space:nowrap}
.note h2{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.note h2 .jp{color:var(--shu);font-size:1rem}
.note h3{margin-block:14px 6px}
.tbl{overflow-x:auto;border:1px solid var(--grid);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem;word-break:keep-all}
th,td{padding:7px 10px;border-bottom:1px solid var(--grid-soft);text-align:left;vertical-align:top}
th{background:var(--grid-soft);font-weight:700;font-size:.8rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .jp,.big-jp{font-size:1.12rem}
td .jp{white-space:nowrap}
.callout{border-left:4px solid var(--shu);background:var(--shu-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.callout.ai{border-color:var(--ai);background:var(--ai-soft)}
.callout b{color:var(--shu)}
.callout.ai b{color:var(--ai)}
ul.tight{margin:6px 0 0;padding-left:1.2em}
ul.tight li{margin-block:2px}
.mark{outline:2px solid var(--shu);outline-offset:1px;border-radius:3px}
.tmark{font-size:.66rem;color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap;font-weight:700;vertical-align:middle}
.hide-on .cov{background:var(--grid);color:transparent;border-radius:4px;cursor:pointer;user-select:none}
.hide-on .cov.show{background:transparent;color:inherit}
.hide-on .cov .jp{color:transparent}
.hide-on .cov.show .jp{color:inherit}
.wordrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding-block:8px;border-bottom:1px solid var(--grid-soft)}
.wordrow:last-child{border-bottom:0}
.gk{display:inline-grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--grid);font-family:var(--f-jp);font-weight:600;font-size:1.35rem;border-radius:4px;background:var(--sheet)}
.gk.star{border-color:var(--shu);color:var(--shu)}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-width:0}
.w{display:inline-flex;align-items:baseline;gap:6px}
.w .jp{font-size:1.1rem}
.w .kj{color:var(--ink-2);font-size:.82rem;font-family:var(--f-jp)}
/* gojuon */
.gojuon{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:420px}
.gojuon button{border:1px solid var(--grid);background:var(--sheet);border-radius:6px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.gojuon button .jp{font-size:1.4rem}
.gojuon button .r{font-size:.7rem;color:var(--ink-2)}
.gojuon .blank{visibility:hidden}
.gojuon.y3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:300px}
/* puzzle */
.puzzle{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:400px;user-select:none}
.puzzle button{aspect-ratio:1;max-width:100%;border:1px solid var(--grid);background:var(--sheet);border-radius:4px;font-family:var(--f-jp);font-weight:600;font-size:1.05rem;padding:0;position:relative}
.puzzle button.sel{background:var(--ai-soft);border-color:var(--ai)}
.puzzle button.f1{background:#DCEBFF;color:#123}.puzzle button.f2{background:#D9F2E4;color:#123}.puzzle button.f3{background:#FFE2D6;color:#123}
.puzzle button.f4{background:#EADFFF;color:#123}.puzzle button.f5{background:#FFD9DE;color:#123}.puzzle button.f6{background:#FFEFC7;color:#123}
/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qhead .count{font-variant-numeric:tabular-nums;font-weight:700}
.qcard{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);position:relative}
.qtag{font-size:.75rem;color:var(--ink-2);font-weight:700;letter-spacing:.04em;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-right:72px}
.qtag .hot{color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 5px}
.qprompt{margin-block:12px 4px;font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.qcard.done .qprompt{padding-right:70px}
.qprompt .jp.huge{font-size:3.2rem;font-weight:600;line-height:1.2;display:inline-block;min-width:1.4em;text-align:center;border:2px solid var(--grid);border-radius:8px;padding:4px 12px;background:var(--paper)}
.qprompt .jp.big{font-size:1.7rem}
.qhint{font-size:.86rem;color:var(--ink-2)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1.5px solid var(--grid);background:var(--sheet);border-radius:8px;padding:11px 12px;min-height:52px;overflow-wrap:anywhere}
.opt .key{width:24px;height:24px;border-radius:50%;border:1px solid var(--grid);display:grid;place-items:center;font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opt .jp{font-size:1.25rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.verdict{position:absolute;top:10px;right:12px;width:62px;height:62px;border-radius:50%;border:3px solid;display:grid;place-items:center;font-weight:700;transform:rotate(-10deg);font-size:.9rem;pointer-events:none;background:var(--sheet)}
.verdict.ok{color:var(--good);border-color:var(--good);font-family:var(--f-jp);font-size:1.05rem}
.verdict.no{color:var(--bad);border-color:var(--bad);font-size:1.9rem}
@media (prefers-reduced-motion:no-preference){.verdict{animation:stamp .22s ease-out}@keyframes stamp{from{transform:rotate(-10deg) scale(1.6);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}}
.explain{margin-top:12px;border-top:1px dashed var(--grid);padding-top:12px;font-size:.92rem}
.explain .jp{font-size:1.05rem}
.qfoot{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.answer-input{width:100%;font-family:var(--f-jp);font-size:1.6rem;font-weight:600;padding:10px 12px;border:2px solid var(--grid);border-radius:8px;background:var(--paper);color:var(--ink);min-height:58px}
.pad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:10px}
.pad button{border:1px solid var(--grid);background:var(--sheet);border-radius:5px;font-family:var(--f-jp);font-weight:600;font-size:1.05rem;padding:6px 0;min-width:0}
.pad .sp{visibility:hidden}
.padctl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:6px}
.padctl button{border:1px solid var(--grid);background:var(--grid-soft);border-radius:5px;padding:8px 0;font-weight:700;font-size:.9rem}
.padctl .jp{font-size:1.05rem}
.card-ans{margin-top:14px;border-top:1px dashed var(--grid);padding-top:14px;text-align:center}
.card-ans .jp{font-size:2.2rem}
/* setup */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--sheet);padding:8px 12px;font-size:.88rem;border-right:1px solid var(--grid)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
/* results */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.rlist{display:grid;gap:8px}
.ritem{border:1px solid var(--grid);border-radius:8px;padding:10px 12px;background:var(--sheet);display:grid;gap:3px}
.ritem .q{font-weight:600}
.ritem .a{color:var(--good)}
.ritem .y{color:var(--bad)}
.empty{text-align:center;padding:26px 10px;color:var(--ink-2)}
.empty .jp{font-size:2.4rem;color:var(--good);display:block}
.kbdhint{font-size:.75rem;color:var(--ink-2)}
@media (max-width:420px){
  .starts{grid-template-columns:1fr}
  .deck{grid-template-columns:minmax(0,1fr) 64px 40px}
  .qprompt .jp.huge{font-size:2.7rem}
  .pad button{font-size:.95rem}
}
</style>
</head>

<div class="wrap" id="app" aria-live="polite"></div>
<nav class="tabs" aria-label="메뉴"><div class="in">
  <a href="#home" data-tab="home"><span class="k">家</span>홈</a>

</div></nav>

<script>
(function(){
'use strict';
/* =========================================================
   DATA — 김순희 선생님 정리본(PDF 13쪽) + 인사·수업 표현 시트
   ========================================================= */

// 청음 46자: [가나, 로마자, 한글]
const SEION = [
 ['あ','a','아'],['い','i','이'],['う','u','우'],['え','e','에'],['お','o','오'],
 ['か','ka','카'],['き','ki','키'],['く','ku','쿠'],['け','ke','케'],['こ','ko','코'],
 ['さ','sa','사'],['し','shi','시'],['す','su','스'],['せ','se','세'],['そ','so','소'],
 ['た','ta','타'],['ち','chi','치'],['つ','tsu','츠'],['て','te','테'],['と','to','토'],
 ['な','na','나'],['に','ni','니'],['ぬ','nu','누'],['ね','ne','네'],['の','no','노'],
 ['は','ha','하'],['ひ','hi','히'],['ふ','fu','후'],['へ','he','헤'],['ほ','ho','호'],
 ['ま','ma','마'],['み','mi','미'],['む','mu','무'],['め','me','메'],['も','mo','모'],
 ['や','ya','야'],['ゆ','yu','유'],['よ','yo','요'],
 ['ら','ra','라'],['り','ri','리'],['る','ru','루'],['れ','re','레'],['ろ','ro','로'],
 ['わ','wa','와'],['を','o','오'],['ん','n','응']
];
const GOJUON_LAYOUT = [
 ['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],
 ['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],
 ['ら','り','る','れ','ろ'],['わ','','','','を'],['ん','','','','']
];
const DAKU = [
 ['が','ga','가'],['ぎ','gi','기'],['ぐ','gu','구'],['げ','ge','게'],['ご','go','고'],
 ['ざ','za','자'],['じ','ji','지'],['ず','zu','즈'],['ぜ','ze','제'],['ぞ','zo','조'],
 ['だ','da','다'],['ぢ','ji','지'],['づ','zu','즈'],['で','de','데'],['ど','do','도'],
 ['ば','ba','바'],['び','bi','비'],['ぶ','bu','부'],['べ','be','베'],['ぼ','bo','보']
];
const HANDAKU = [['ぱ','pa','파'],['ぴ','pi','피'],['ぷ','pu','푸'],['ぺ','pe','페'],['ぽ','po','포']];
const YOON = [
 ['きゃ','kya','캬'],['きゅ','kyu','큐'],['きょ','kyo','쿄'],
 ['しゃ','sha','샤'],['しゅ','shu','슈'],['しょ','sho','쇼'],
 ['ちゃ','cha','챠'],['ちゅ','chu','츄'],['ちょ','cho','쵸'],
 ['にゃ','nya','냐'],['にゅ','nyu','뉴'],['にょ','nyo','뇨'],
 ['ひゃ','hya','햐'],['ひゅ','hyu','휴'],['ひょ','hyo','효'],
 ['みゃ','mya','먀'],['みゅ','myu','뮤'],['みょ','myo','묘'],
 ['りゃ','rya','랴'],['りゅ','ryu','류'],['りょ','ryo','료'],
 ['ぎゃ','gya','갸'],['ぎゅ','gyu','규'],['ぎょ','gyo','교'],
 ['じゃ','ja','쟈'],['じゅ','ju','쥬'],['じょ','jo','죠'],
 ['ぢゃ','ja','쟈'],['ぢゅ','ju','쥬'],['ぢょ','jo','죠'],
 ['びゃ','bya','뱌'],['びゅ','byu','뷰'],['びょ','byo','뵤'],
 ['ぴゃ','pya','퍄'],['ぴゅ','pyu','퓨'],['ぴょ','pyo','표']

// 히라가나 단어 총정리 (46행 전체 · 가타카나 제외). r=표의 행, m=선생님 빨간 표시, d=뜻 구분용 보충
const WORDS = [
 {r:'い',k:'あい',j:'愛',m:'사랑'},
 {r:'う',k:'いう',j:'言う',m:'말하다'},
 {r:'え',k:'え',j:'絵',m:'그림'},{r:'え',k:'いえ',j:'家',m:'집'},{r:'え',k:'いいえ',j:'',m:'아니오'},
 {r:'お',k:'あお',j:'青',m:'파랑'},{r:'お',k:'あおい',j:'青い',m:'파랗다'},

const VOW = {}; [['あかさたなはまやらわがざだばぱ','a'],['いきしちにひみりぎじぢびぴ','i'],['うくすつぬふむゆるぐずづぶぷ','u'],['えけせてねへめれげぜでべぺ','e'],['おこそとのほもよろをごぞどぼぽ','o']].forEach(([cs,v])=>[...cs].forEach(c=>VOW[c]=v));
const unitVowel = u => { const last=u.slice(-1); return ({'ゃ':'a','ゅ':'u','ょ':'o'})[last] || VOW[last]; };
const moraDisp = s => { const m=moraSplit(s); return m.map((u,i)=>{ if(!i) return u; const pv=unitVowel(m[i-1]);
  if((u==='う' && (pv==='o'||pv==='u')) || (u==='い' && (pv==='e'||pv==='i')) || (u==='あ' && pv==='a')) return 'ー'; return u; }); };

const TO_BIG = {'ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ'};
const DAK = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const UNDAK = Object.fromEntries(Object.entries(DAK).map(([a,b])=>[b,a]));

const LOOKALIKE = [['さ','ち','き'],['ね','れ','わ'],['ぬ','め'],['る','ろ'],['は','ほ','け'],['い','り'],['こ','に'],['あ','お'],['う','つ'],['ま','も'],['た','な'],['し','つ'],['く','へ']];

// 함정 오답 만들기: 작은/큰 글자, 탁점, 장음 빼기, 촉음 빼기, 비슷한 모양
function traps(w){
  const ch=[...w], out=new Set();
  const rep=(i,x)=>{ const a=ch.slice(); a[i]=x; out.add(a.join('')); };
  ch.forEach((c,i)=>{
    if(TO_SMALL[c] && i>0) rep(i,TO_SMALL[c]);
    if(TO_BIG[c]) rep(i,TO_BIG[c]);
    if(DAK[c] && c!=='ち' && c!=='つ') rep(i,DAK[c]);
    if(UNDAK[c]) rep(i,UNDAK[c]);
    if(UNHAN[c]) rep(i,UNHAN[c]);
    LOOKALIKE.forEach(g=>{ if(g.includes(c)) g.forEach(x=>{ if(x!==c) rep(i,x); }); });
    if(i>0 && ((c==='う' && ODAN.has(ch[i-1])) || (c==='い' && EDAN.has(ch[i-1])))){ const a=ch.slice(); a.splice(i,1); out.add(a.join('')); }
    if(i>0 && c==='う' && ODAN.has(ch[i-1])){ const a=ch.slice(); a[i]='お'; out.add(a.join('')); }
    if(c==='っ'){ const a=ch.slice(); a.splice(i,1); out.add(a.join('')); }
  });
  out.delete(w);
  return Array.from(out).filter(x=>x.length>0);
}

/* =========================================================
   PROGRESS (Leitner box 0~5)
   ========================================================= */
let PROG = store.get('prog', {});
const boxOf = id => (PROG[id] && PROG[id].b) || 0;
const seen = id => !!PROG[id];
function record(id, ok){
  const p = PROG[id] || {b:0,c:0,w:0};
  if(ok){ p.b = Math.min(5, p.b+1); p.c++; } else { p.b = 0; p.w++; p.lw = Date.now(); }
  PROG[id] = p; store.set('prog', PROG);
  const day = ymd();
  const st = store.get('stats', {}); st[day] = (st[day]||0)+1; store.set('stats', st);
}
const mastered = id => boxOf(id) >= 3;
function weight(it){
  const p = PROG[it.id];
  let w;
  if(!p) w = 3;
  else w = [7,4,2.2,1,.5,.25][p.b];
  if(it.hot) w *= 1.4;
  return w;
}
function weightedPick(pool, n){
  const arr = pool.map(it=>({it, k: Math.pow(Math.random(), 1/weight(it))}));
  arr.sort((a,b)=>b.k-a.k);
  return arr.slice(0,n).map(x=>x.it);
}
function deckStats(id){
  const items = ITEMS.filter(i=>i.deck===id);
  const m = items.filter(i=>mastered(i.id)).length;
  const weak = items.filter(i=>PROG[i.id] && PROG[i.id].w>0 && !mastered(i.id)).length;
  return {total:items.length, m, weak, seen: items.filter(i=>seen(i.id)).length};
}

/* =========================================================
   OPTIONS
   ========================================================= */
function buildOptions(it){
  if(it.deck==='mora'){ const n=parseInt(it.a,10); const k=Math.floor(Math.random()*(Math.min(3,n-1)+1)); const o=[]; for(let x=n-k;o.length<4;x++) o.push(x+'박'); return shuffle(o); }
  if(it.fixed) return shuffle([it.a].concat(it.d.slice(0,3)));
  const bad = new Set([it.a].concat(it.alt||[]));
  const t = uniq((it.trapD||[]).filter(x=>!bad.has(x)));
  const pickT = sample(t, Math.min(t.length, it.trapD ? 2 : 0));
  pickT.forEach(x=>bad.add(x));
  const rest = sample(uniq(it.d.filter(x=>!bad.has(x))), 3-pickT.length);
  return shuffle([it.a].concat(pickT, rest));
}

function bindNote(){
  const note = $('#note');
  const btn = $('#coverBtn');
  const setCov = ()=>{
    const on = (btn && btn.getAttribute('aria-pressed')==='true');
    const onJ = ($('#coverJp') && $('#coverJp').getAttribute('aria-pressed')==='true');
    note.classList.toggle('hide-on', on || onJ);
    // 단어표/인사송 전용: 뜻·히라가나 칸을 cov로 바꾸기
    $$('.cm', note).forEach(e=>e.classList.toggle('cov', on));
    $$('.cj', note).forEach(e=>e.classList.toggle('cov', onJ));
    if(!$('.cm',note) && !$('.cj',note)) $$('.cov', note).forEach(e=>e.classList.remove('show'));
    $$('.cov', note).forEach(e=>{ e.classList.remove('show'); });
  };
  if(btn) btn.addEventListener('click',()=>{ btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed')!=='true'); setCov(); });
  if($('#coverJp')) $('#coverJp').addEventListener('click',e=>{ const b=e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true'); setCov(); });
  // 일반 cov 요소: 가리기 모드가 아닐 때는 그냥 보이게
  note.addEventListener('click', e=>{ const c=e.target.closest('.cov'); if(c && note.classList.contains('hide-on')) c.classList.toggle('show'); });
  note.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('cov')){ e.preventDefault(); e.target.classList.toggle('show'); }});
  if($('#onlyMark')) $('#onlyMark').addEventListener('click',e=>{ const b=e.currentTarget; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on);
    $$('.w',note).forEach(w=>{ w.hidden = on && !w.classList.contains('marked'); });
    $$('.wordrow',note).forEach(r=>{ r.hidden = on && !$('.w.marked',r); });
    $$('h3',note).forEach(h=>{ let n=h.nextElementSibling, any=false; while(n && n.tagName!=='H3'){ if(!n.hidden && (n.classList.contains('wordrow'))) any=true; n=n.nextElementSibling; } const w2=h.nextElementSibling && h.nextElementSibling.classList.contains('words'); h.hidden = on && (w2 || !any); if(w2) h.nextElementSibling.hidden = on; }); });
  // 50음도

  if($('#hideKana')) $('#hideKana').addEventListener('click',e=>{ const b=e.currentTarget; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); $$('.gojuon button .jp',note).forEach(j=>j.style.visibility=on?'hidden':'visible'); });
  $$('.gojuon button[data-k]',note).forEach(b=>b.addEventListener('click',()=>{ const jj=$('.jp',b); if(jj) jj.style.visibility='visible'; }));
  $$('.gojuon button[data-k]',note).forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k; const f=SEION.concat(DAKU,HANDAKU).find(x=>x[0]===k);

    const r=$('.r',b); if(r) r.style.visibility='visible';

    const k=b.dataset.y; const f=YOON.find(x=>x[0]===k); const box=$('#kinfo'); if(!box) return; box.hidden=false;
    box.innerHTML='<b>'+J(k)+' ['+esc(f[2])+'] '+esc(f[1])+'</b><div class="small">'+J(k[0])+' + 작은 '+J(k[1])+' = 한 박. 크게 쓰면 '+J(k[0]+TO_BIG[k[1]])+' (두 박) — 다른 말이 돼요.</div>';

function bindPuzzle(){
  const grid = $('#puzzle'); let start=null; const found = new Set();
  const cells = $$('button',grid);
  const at = (r,c)=>cells[r*10+c];
  function line(a,b){
    const dr=Math.sign(b.r-a.r), dc=Math.sign(b.c-a.c);
    const len=Math.max(Math.abs(b.r-a.r),Math.abs(b.c-a.c));
    if(!(a.r===b.r || a.c===b.c || Math.abs(b.r-a.r)===Math.abs(b.c-a.c))) return null;
    const out=[]; for(let i=0;i<=len;i++) out.push({r:a.r+dr*i,c:a.c+dc*i}); return out;
  }
  function mark(p, n){ p.forEach(x=>at(x.r,x.c).classList.add('f'+n)); }
  function msg(t){ $('#pzMsg').textContent = t; }
  function update(){ msg(found.size+' / 6 찾음'+(found.size===6?' — 전부 찾았어요!':'')); }
  grid.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const p={r:+b.dataset.r,c:+b.dataset.c};
    if(!start){ start=p; b.classList.add('sel'); msg('마지막 글자를 누르세요'); return; }
    at(start.r,start.c).classList.remove('sel');
    const ln=line(start,p); start=null;
    if(!ln){ msg('가로·세로·대각선 직선으로 골라 주세요'); return; }
    if(ln.length<2){ update(); return; }
    const word = ln.map(x=>PUZZLE[x.r][x.c]).join('');
    const hit = PUZZLE_ANS.find(a=>a.w===word || a.w===[...word].reverse().join(''));
    if(hit && !found.has(hit.n)){ found.add(hit.n); mark(ln,hit.n); const tr=$('tr[data-pn="'+hit.n+'"]'); if(tr){ $$('.cov',tr).forEach(c=>c.classList.add('show')); const pp=$('.pzpos',tr); if(pp) pp.hidden=false; } update(); }
    else if(hit) update();
    else if(word==='どうも'||word==='もうど') msg('どうも도 감사 인사지만, 4번 정답은 ありがとう예요. 더 찾아보세요');
    else if(word==='どうぞ'||word==='ぞうど') msg('どうぞ는 よろしく 앞에 붙는 말. 6번 정답은 よろしく');
    else msg('「'+word+'」은(는) 정답이 아니에요');
  });
  // 정답 칸 위치
  const SOL = {1:[[1,2],[1,1]],2:[[6,1],[0,1]],3:[[0,9],[1,-1]],4:[[3,8],[1,0]],5:[[1,0],[1,0]],6:[[8,0],[0,1]]};
  $('#pzShow').addEventListener('click',()=>{
    PUZZLE_ANS.forEach(a=>{ const [[r,c],[dr,dc]]=SOL[a.n]; const ln=[]; for(let i=0;i<[...a.w].length;i++) ln.push({r:r+dr*i,c:c+dc*i}); mark(ln,a.n); found.add(a.n); const tr=$('tr[data-pn="'+a.n+'"]'); if(tr){ $$('.cov',tr).forEach(c=>c.classList.add('show')); const pp=$('.pzpos',tr); if(pp) pp.hidden=false; } });
    update();
  });
  $('#pzReset').addEventListener('click',()=>viewNotes());
  // 표의 정답칸은 항상 가린 상태로 시작
  $('#note').classList.add('hide-on');
}

/* ---------- QUIZ RUN ---------- */
function startQuiz(items, mode, title, kind){
  if(!items.length) return;
  session = {kind:kind||'quiz', title, mode, items, i:0, res:[], done:false};
  session.opts = items.map(it=> mode==='mc' ? buildOptions(it) : null);
  const target = session.kind==='exam' ? '#exam' : '#quiz';
  if(location.hash!==target) location.hash = target; else viewQ();
}
function viewQ(){
  const s = session; const it = s.items[s.i]; const answered = s.res[s.i];
  const deck = DECK[it.deck];
  const pct = Math.round(s.i/s.items.length*100);
  let body = '';
  if(s.mode==='mc'){
    body = '<div class="opts" role="group" aria-label="보기">'+s.opts[s.i].map((o,k)=>{
      let cls='opt'; if(answered){ if(o===it.a) cls+=' right'; else if(o===answered.pick) cls+=' wrong'; }
      return '<button type="button" class="'+cls+'" data-o="'+k+'"'+(answered?' disabled':'')+'><span class="key">'+(k+1)+'</span><span>'+(it.jp?J(o):esc(o))+'</span></button>';
    }).join('')+'</div>';
  } else if(s.mode==='type'){
    body = '<div style="margin-top:14px"><label for="ans" class="small muted">히라가나로 입력</label><input id="ans" class="answer-input" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(answered?answered.pick:(s.draft||''))+'"'+(answered?' readonly':'')+'>'+
      (answered?'':kanaPad())+'</div>'+
      (answered?'<div class="callout '+(answered.ok?'ai':'')+'" style="margin-top:10px">정답: '+J(it.a)+(answered.ok?'':' · 내 답: '+J(answered.pick||'(빈칸)'))+'</div>':'');
  } else {
    body = answered||s.flip ? '<div class="card-ans">'+(it.jp?J(it.a):'<b style="font-size:1.3rem">'+esc(it.a)+'</b>')+'</div>' : '<p class="small muted" style="margin-top:14px">종이에 답을 써 본 다음 정답을 여세요.</p>';
  }
  const verdict = answered ? '<div class="verdict '+(answered.ok?'ok':'no')+'">'+(answered.ok?'正解':'×')+'</div>' : '';
  let foot = '';
  if(!answered){
    if(s.mode==='type') foot = '<button class="btn ghost" id="skip" type="button">모르겠음</button><button class="btn primary" id="check" type="button">채점</button>';
    else if(s.mode==='card') foot = s.flip ? '<button class="btn" id="cNo" type="button">틀렸어요</button><button class="btn primary" id="cYes" type="button">맞았어요</button>' : '<span></span><button class="btn primary" id="flip" type="button">정답 보기</button>';
    else foot = '<button class="btn ghost" id="skip" type="button">모르겠음</button><span class="kbdhint">키보드 1~4</span>';
  } else {
    foot = '<button class="btn ghost" id="quit" type="button">그만하기</button><button class="btn primary" id="next" type="button">'+(s.i+1<s.items.length?'다음 →':'결과 보기')+'</button>';
  }
  app.innerHTML = header(esc(s.title))+
   '<div class="qhead"><span class="count">'+(s.i+1)+' / '+s.items.length+'</span><div class="bar" style="flex:1"><i style="width:'+pct+'%;background:var(--ink)"></i></div><span class="small muted">맞음 '+s.res.filter(r=>r&&r.ok).length+'</span></div>'+
   '<div class="qcard'+(answered?' done':'')+'">'+verdict+
    '<div class="qtag"><span>'+esc(deck.group)+' · '+esc(deck.name)+'</span>'+(it.hot?'<span class="hot">출제 유력</span>':'')+'</div>'+
    '<div class="qprompt">'+it.q+'</div>'+(it.hint?'<div class="qhint">'+it.hint+'</div>':'')+
    body+
    (answered?'<div class="explain">'+it.ex+'</div>':'')+
    '<div class="qfoot">'+foot+'</div>'+
   '</div>';
  // bind
  $$('.opt').forEach(b=>b.addEventListener('click',()=>answer(s.opts[s.i][+b.dataset.o])));
  if($('#skip')) $('#skip').addEventListener('click',()=>answer(null));
  if($('#next')) $('#next').addEventListener('click',next);
  if($('#quit')) $('#quit').addEventListener('click',()=>{ s.planned = s.items.length; s.quit = s.i+1<s.items.length; s.items = s.items.slice(0,s.i+1); s.opts=s.opts.slice(0,s.i+1); finish(); });
  if($('#flip')) $('#flip').addEventListener('click',()=>{ s.flip=true; viewQ(); });
  if($('#cYes')) $('#cYes').addEventListener('click',()=>{ s.flip=false; answer(it.a, true); });
  if($('#cNo')) $('#cNo').addEventListener('click',()=>{ s.flip=false; answer('', false); });
  if($('#check')) $('#check').addEventListener('click',()=>answer($('#ans').value));
  const inp = $('#ans');
  if(inp && !answered){
    inp.addEventListener('input',()=>{ s.draft = inp.value; });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); answer(inp.value); } });
    bindPad(inp);
  }
  const nb = $('#next'); if(nb) nb.focus({preventScroll:true});
  bindTheme();
}
function norm(x){ return kanaOnly(String(x||'')).replace(/ー/g,'ー'); }
function answer(pick, forced){
  const s=session; const it=s.items[s.i];
  let ok;
  if(forced!==undefined) ok = forced;
  else if(s.mode==='type') ok = pick!=null && [it.a].concat(it.alt||[]).some(x=>norm(pick)===norm(x));
  else ok = pick===it.a;
  s.res[s.i] = {ok, pick: pick==null?'':pick};
  s.draft = '';
  record(it.id, ok);
  viewQ();
}
function next(){ const s=session; if(s.i+1<s.items.length){ s.i++; s.flip=false; viewQ(); } else finish(); }
function finish(){
  const s=session; s.done=true;
  const n=s.items.length, ok=s.res.filter(r=>r&&r.ok).length;
  const wrong = s.items.map((it,i)=>({it,r:s.res[i]})).filter(x=>!x.r||!x.r.ok);
  const score = s.kind==='exam' ? Math.round(ok/(s.planned||n)*100) : null;
  // 단원별
  const byDeck = {};
  s.items.forEach((it,i)=>{ const d=byDeck[it.deck]||(byDeck[it.deck]={n:0,ok:0}); d.n++; if(s.res[i]&&s.res[i].ok) d.ok++; });
  app.innerHTML = header(esc(s.title)+' — 결과')+
   '<div class="stack"><section class="sheet stack">'+
    (score!=null?'<div class="score"><b>'+score+'</b><span>점 / 100'+(s.quit?' (중간에 그만둠 — 안 푼 문제는 틀린 것으로)':'')+'</span></div>':'<div class="score"><b>'+ok+'</b><span>/ '+n+' 맞음</span></div>')+
    '<div class="bar"><i style="width:'+Math.round(ok/n*100)+'%"></i></div>'+
    '<div class="small">'+Object.entries(byDeck).map(([d,v])=>esc(DECK[d].name)+' '+v.ok+'/'+v.n).join(' · ')+'</div>'+
    '<div class="row">'+(wrong.length?'<button class="btn shu" id="retryWrong" type="button">틀린 '+wrong.length+'문제 다시</button>':'')+'<button class="btn" id="again" type="button">'+(s.kind==='exam'?'새 모의고사':'새로 풀기')+'</button><a class="btn ghost" href="#home" style="text-decoration:none">홈</a></div>'+
   '</section>'+
   (wrong.length?'<section class="stack"><h2>틀린 문제 해설</h2><div class="rlist">'+wrong.map(x=>'<div class="ritem"><div class="q">'+x.it.q+'</div>'+(x.it.hint?'<div class="small muted">'+x.it.hint+'</div>':'')+'<div class="y small">내 답: '+(x.r&&x.r.pick?(x.it.jp?J(x.r.pick):esc(x.r.pick)):'(모름)')+'</div><div class="a">정답: '+(x.it.jp?J(x.it.a):esc(x.it.a))+'</div><div class="small">'+x.it.ex+'</div></div>').join('')+'</div></section>':'<div class="sheet empty"><span class="jp">満点</span>전부 맞았어요!</div>')+
   '</div>';
  if($('#retryWrong')) $('#retryWrong').addEventListener('click',()=>startQuiz(shuffle(wrong.map(x=>x.it)), s.mode==='card'?'card':s.mode, '틀린 문제 다시', 'quiz'));
  $('#again').addEventListener('click',()=>{ if(s.kind==='exam') startExam(); else { session=null; location.hash='#quiz'; route(); } });
  if(s.kind==='exam'){ const h=store.get('examHist',[]); h.push({d:ymd(),s:score,q:s.quit?1:0}); store.set('examHist',h.slice(-20)); }
  bindTheme();
}

/* 히라가나 자판 */
function kanaPad(){
  const cols = GOJUON_LAYOUT.slice(0,10); // あ~わ 행 (오른쪽→왼쪽)
  let cells='';
  for(let r=0;r<5;r++){ for(let c=0;c<10;c++){ const k=cols[c][r]; cells += k?'<button type="button" data-pk="'+k+'">'+k+'</button>':'<button type="button" class="sp" tabindex="-1" aria-hidden="true"></button>'; } }
  return '<div class="pad" aria-label="히라가나 자판">'+cells+'</div>'+
   '<div class="padctl"><button type="button" data-pc="ん"><span class="jp">ん</span></button><button type="button" data-pc="dak" aria-label="탁점 붙이기">゛</button><button type="button" data-pc="han" aria-label="반탁점 붙이기">゜</button><button type="button" data-pc="small" aria-label="작은 글자로">小</button><button type="button" data-pc="space" aria-label="띄어쓰기">␣</button><button type="button" data-pc="bs" aria-label="지우기">⌫</button></div>';
}
function bindPad(inp){
  $$('.pad button,.padctl button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
  $$('[data-pk]').forEach(b=>b.addEventListener('click',()=>{ inp.value += b.dataset.pk; session.draft=inp.value; }));
  $$('[data-pc]').forEach(b=>b.addEventListener('click',()=>{
    const v=inp.value, last=v.slice(-1), head=v.slice(0,-1); const c=b.dataset.pc;
    if(c==='ん') inp.value=v+'ん';
    else if(c==='bs') inp.value=head;
    else if(c==='space') inp.value=v+' ';
    else if(c==='dak'){ if(DAK[last]) inp.value=head+DAK[last]; else if(UNDAK[last]) inp.value=head+UNDAK[last]; else if(UNHAN[last]) inp.value=head+DAK[UNHAN[last]]; }
    else if(c==='han'){ if(HAN[last]) inp.value=head+HAN[last]; else if(UNHAN[last]) inp.value=head+UNHAN[last]; }
    else if(c==='small'){ if(TO_SMALL[last]) inp.value=head+TO_SMALL[last]; else if(TO_BIG[last]) inp.value=head+TO_BIG[last]; }
    session.draft=inp.value;
  }));
}

(function(){ const t=store.get('theme',''); if(t) document.documentElement.setAttribute('data-theme',t); })();

/* keyboard: 1~4, Enter */
document.addEventListener('keydown',e=>{
  if(!session || session.done) return;
  const h=location.hash; if(!((h==='#quiz'&&session.kind==='quiz')||(h==='#exam'&&session.kind==='exam'))) return;
  if(!document.querySelector('.qcard')) return;
  if(e.target && (e.target.tagName==='INPUT')) return;
  if(e.target && e.target.closest && e.target.closest('.pad,.padctl')) { if(e.key==='Enter'){ e.preventDefault(); const inp=$('#ans'); if(inp && !session.res[session.i]) answer(inp.value); } return; }
  const s=session;
  if(!s.res[s.i] && s.mode==='type' && e.key==='Enter'){ const inp=$('#ans'); if(inp){ e.preventDefault(); answer(inp.value); } return; }
  if(!s.res[s.i] && s.mode==='mc' && /^[1-4]$/.test(e.key)){ const o=s.opts[s.i][+e.key-1]; if(o!==undefined) answer(o); }
  else if(s.res[s.i] && (e.key==='Enter'||e.key==='ArrowRight')){ e.preventDefault(); next(); }
});
window.addEventListener('hashchange', route);
window.__HIRA = {ITEMS, DECKS, buildOptions, traps, moraCount, WORDS};
route();
})();
