name: 시험기간 응원 메일

on:
  schedule:
    # 매일 22:45 KST(13:45 UTC)에 시작해서 스크립트가 23:15 KST까지 기다렸다가 보낸다.
    # GitHub 예약 실행은 몇 분~수십 분 늦게 시작될 수 있어서 30분 여유를 둔다.
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "시험 발송할 날짜 (YYYY-MM-DD, 비우면 오늘). 즉시 발송한다."
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 메일 보내기
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_DATE: ${{ github.event.inputs.date }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python cheer/send.py
